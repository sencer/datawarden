[project]
name = "datawarden"
version = "0.1.1"
description = "Declarative data validation library for Pandas"
authors = [{ name = "Sencer S.", email = "nospam@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "numba>=0.57.0",
    "loguru>=0.7.2",
    "filelock>=3.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datawarden"]
[project.optional-dependencies]
dev = [
    "basedpyright>=1.36.2",
    "hypothesis>=6.148.11",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "pandas-stubs>=2.3.3",
]


[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 2
fix = true
show-fixes = true
preview = true

[tool.ruff.lint]
# Comprehensive rule set for strict checking
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except (no bare except:)
    "C4",     # flake8-comprehensions
    "C90",    # mccabe complexity
    "T20",    # flake8-print (no print statements)
    "SIM",    # flake8-simplify
    "N",      # pep8-naming
    "Q",      # flake8-quotes
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint (includes PLR1702: too-many-nested-blocks)
    "PERF",   # perflint (performance)
    "ANN",    # flake8-annotations
    "ARG",    # flake8-unused-arguments
    "FBT",    # flake8-boolean-trap (no boolean positional args)
    "RET",    # flake8-return
    "TCH",    # flake8-type-checking
]

ignore = [
    "E501",    # Line too long (formatter handles this)
    "S603",    # subprocess without shell=True (too strict)
    "S607",    # Starting a process with a partial path (too strict)
    "FBT",     # Allow boolean arguments (validate=True)
    "E111",    # Indentation is not a multiple of 4
    "E114",    # Indentation is not a multiple of 4 (comment)
    # Complexity rules (legitimate domain complexity for type introspection)
    "PLR0915", # Too many statements (decorator introspection)
    "PLR0912", # Too many branches (decorator introspection)
    "PLR1702", # Too many nested blocks (type introspection)
    "PLW0603", # Global statement for shared executor (intentional lazy init)
]

# Complexity limits (anti-LLM-slop)
[tool.ruff.lint.mccabe]
max-complexity = 10  # Maximum cyclomatic complexity

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "PLR2004", # Allow magic values in tests
    "ANN201",  # Don't require return type in tests.
    "PLR6301", # Allow methods that don't use self (common in test classes)
]

[tool.ruff.lint.isort]
known-first-party = ["datawarden"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-decorators = ["datawarden.validate"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

reportMissingImports = true
reportMissingTypeStubs = true
reportUndefinedVariable = true
reportAssertAlwaysTrue = true
reportInvalidStringEscapeSequence = true
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
# reportAny is relaxed to "warning" since pandas-stubs/numpy-stubs use Any extensively
reportAny = "warning"
reportExplicitAny = "warning"
reportIgnoreCommentWithoutRule = true
reportPrivateLocalImportUsage = true
reportMissingParameterType = true
reportMissingTypeArgument = true
# Unknown type reports are relaxed to "warning" due to pandas-stubs/numpy-stubs
# having incomplete type coverage that causes false positives in generic code
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportUntypedBaseClass = true
reportUntypedNamedTuple = true
# reportIncompatibleMethodOverride is relaxed due to name mismatches in base class params
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportUninitializedInstanceVariable = true
reportOverlappingOverload = true
# reportMissingSuperCall generates false positives for frozen dataclasses and __init__
reportMissingSuperCall = "warning"
# Relaxed due to pandas-stubs/numpy-stubs having incomplete generic type support
reportInvalidTypeArguments = "warning"
reportReturnType = "warning"
reportAttributeAccessIssue = "warning"
reportAssignmentType = "warning"
reportCallIssue = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportPrivateUsage = true
reportConstantRedefinition = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUnsupportedDunderAll = true
reportUnusedClass = "error"        # STRICT: Error instead of warning
reportUnusedFunction = "error"     # STRICT: Error instead of warning
reportUnusedVariable = "error"     # STRICT: Error instead of warning
reportUnusedImport = "error"       # STRICT: Error instead of warning
reportDuplicateImport = "error"    # STRICT: Error instead of warning
# reportUnnecessaryIsInstance is relaxed since pandas unions need runtime checks
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "error"               # STRICT: Error
reportUnnecessaryComparison = "error"         # STRICT: Error
reportUnnecessaryContains = "error"           # STRICT: Error
# reportGeneralTypeIssues, reportArgumentType are relaxed due to pandas-stubs limitations
# (e.g., DataF.all() returns type that can't be used in conditionals per stubs)
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportPropertyTypeMismatch = true
reportFunctionMemberAccess = true
reportCallInDefaultInitializer = true
reportImplicitStringConcatenation = true  # STRICT: Enable
# reportOperatorIssue is relaxed since pandas operator stubs are incomplete
reportOperatorIssue = "warning"
reportImplicitOverride = true    # STRICT: Require @override decorator (Python 3.12+)
reportDeprecated = "warning"     # Warn on deprecated usage

# ============================================================
# ADDITIONAL TYPE CHECKS
# ============================================================
reportImportCycles = "warning"

# ============================================================
# EXCLUSIONS
# ============================================================
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "benchmarks",
    "tests",
]

# ============================================================
# PYTEST CONFIGURATION
# ============================================================
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-W error",  # STRICT: Treat warnings as errors (catch deprecations early)
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=80",  # STRICT: Require 80% coverage
]
filterwarnings = [
    "error",  # Treat all warnings as errors by default
]

